name: Actualizar perfil (estadísticas, 3D y snake)

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días (01:00 hora de Perú)
  workflow_dispatch:       # botón "Run workflow" para ejecutarlo a mano
  push:
    branches: [main]
    paths: [".github/workflows/perfil.yml"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ── Contribuciones en 3D (rascacielos isométrico) ─────────────────────
      - name: Contribuciones 3D
        uses: yoshi389111/github-profile-3d-contrib@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # ── Tarjetas de estadísticas (se guardan en /profile) ─────────────────
      - name: Estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=0d1117&title_color=00C0E7&icon_color=00C0E7&text_color=c9d1d9&ring_color=E31E24&custom_title=Estad%C3%ADsticas%20de%20GitHub
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lenguajes más usados
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0d1117&title_color=00C0E7&text_color=c9d1d9&custom_title=Lenguajes%20m%C3%A1s%20usados
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proyecto - Bootcamp Platform
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=bootcamp-platform&show_owner=false&hide_border=true&bg_color=0d1117&title_color=00C0E7&icon_color=E31E24&text_color=c9d1d9
          path: profile/pin-bootcamp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proyecto - Soluciones Integrales
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=PROYECTO-SOLUCIONES-INTEGRALES&show_owner=false&hide_border=true&bg_color=0d1117&title_color=00C0E7&icon_color=E31E24&text_color=c9d1d9
          path: profile/pin-soluciones.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Serpiente que se come las contribuciones ──────────────────────────
      - name: Snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark&color_snake=#00C0E7

      # ── Guardar todo en el repositorio ────────────────────────────────────
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile profile-3d-contrib || true
          git commit -m "Actualizar tarjetas del perfil" || exit 0
          git push
